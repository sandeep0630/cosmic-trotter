[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Local:
#   - Put key in project-root .env or .env.txt as either:
#       GEMINI_API_KEY=...
#       API=...          (also accepted)
#   - Run API:  node scripts/local-ask-krishna-server.js
#     or:       npx netlify dev
# Production: set GEMINI_API_KEY (or API) in Netlify env vars — never commit secrets.

# CORS is set per-function (allowlist: cosmictrotter.com, www, localhost).
# Do not set Access-Control-Allow-Origin: * here — duplicate/wildcard headers break browsers.
